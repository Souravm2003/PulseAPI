<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — PulseAPI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            font-family: "Lexend", sans-serif;
        }

        body {
            background: #ffffff;
        }

        .mono {
            font-family: "JetBrains Mono", monospace;
        }

        .orange-gradient {
            background: linear-gradient(
                135deg,
                #ff9a3d,
                #ff6b00,
                #f4511e
            );
        }

        .orange-text {
            color: #ff6b00;
        }

        .card-shadow {
            box-shadow:
                0 25px 70px rgba(17, 24, 39, .08),
                0 5px 20px rgba(17, 24, 39, .04);
        }

        .grid-bg {
            background-image:
                linear-gradient(
                    rgba(255, 107, 0, .045) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 107, 0, .045) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;
        }

        .input {
            transition: .2s ease;
        }

        .input:focus {
            outline: none;
            border-color: #ff6b00;
            box-shadow:
                0 0 0 4px rgba(255, 107, 0, .08);
        }

        .google-button {
            transition:
                background .2s ease,
                transform .2s ease;
        }

        .google-button:hover {
            background: #fafafa;
            transform: translateY(-1px);
        }

        .btn-primary {
            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow:
                0 14px 30px rgba(255, 107, 0, .25);
        }
    </style>
</head>

<body class="min-h-screen">

    <div class="fixed inset-0 grid-bg pointer-events-none"></div>


    <!-- NAVBAR -->

    <header class="relative z-10">

        <nav
            class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between"
        >

            <a
                href="/"
                class="flex items-center gap-3"
            >

                <svg
                    viewBox="0 0 48 48"
                    class="w-10 h-10"
                    fill="none"
                >

                    <path
                        d="M4 25h8l5-15 7 28 6-18 4 8h10"
                        stroke="#ff6b00"
                        stroke-width="4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

                <span class="text-2xl font-extrabold">
                    Pulse<span class="orange-text">API</span>
                </span>

            </a>


            <a
                href="/login/"
                class="text-sm font-semibold text-gray-600 hover:text-orange-600 transition"
            >
                Already have an account?

                <span class="orange-text">
                    Sign in
                </span>
            </a>

        </nav>

    </header>


    <!-- REGISTER -->

    <main
        class="relative z-10 min-h-[calc(100vh-96px)] flex items-center justify-center px-6 py-10"
    >

        <div class="w-full max-w-md">


            <!-- HEADING -->

            <div class="text-center mb-8">

                <div
                    class="mx-auto mb-5 w-14 h-14 rounded-2xl orange-gradient flex items-center justify-center shadow-lg shadow-orange-500/20"
                >

                    <svg
                        viewBox="0 0 48 48"
                        class="w-8 h-8"
                        fill="none"
                    >

                        <path
                            d="M4 25h8l5-15 7 28 6-18 4 8h10"
                            stroke="white"
                            stroke-width="4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </div>


                <h1
                    class="text-3xl font-extrabold tracking-tight"
                >
                    Create your account
                </h1>


                <p class="mt-3 text-gray-500">
                    Start monitoring your APIs with PulseAPI.
                </p>

            </div>


            <!-- CARD -->

            <div
                class="bg-white border border-gray-100 rounded-3xl p-7 sm:p-8 card-shadow"
            >


                <!-- GOOGLE -->

                <button
                    id="googleRegisterButton"
                    type="button"
                    class="google-button w-full h-12 rounded-xl border border-gray-200 bg-white flex items-center justify-center gap-3 font-semibold text-sm"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                    >

                        <path
                            fill="#4285F4"
                            d="M21.35 12.27c0-.71-.06-1.39-.18-2.04H12v3.86h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.21z"
                        />

                        <path
                            fill="#34A853"
                            d="M12 21.75c2.63 0 4.84-.87 6.46-2.37l-3.14-2.45c-.87.58-1.98.92-3.32.92-2.55 0-4.71-1.72-5.49-4.04H3.27v2.53A9.75 9.75 0 0 0 12 21.75z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M6.51 13.81a5.86 5.86 0 0 1 0-3.62V7.66H3.27a9.75 9.75 0 0 0 0 8.68l3.24-2.53z"
                        />

                        <path
                            fill="#EA4335"
                            d="M12 6.15c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.25 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.73 5.41l3.24 2.53C7.29 7.87 9.45 6.15 12 6.15z"
                        />

                    </svg>

                    Continue with Google

                </button>


                <!-- DIVIDER -->

                <div class="flex items-center gap-4 my-6">

                    <div class="h-px bg-gray-100 flex-1"></div>

                    <span class="text-xs text-gray-400">
                        OR
                    </span>

                    <div class="h-px bg-gray-100 flex-1"></div>

                </div>


                <!-- FORM -->

                <form
                    id="registerForm"
                    class="space-y-5"
                >


                    <!-- USERNAME -->

                    <div>

                        <label
                            for="username"
                            class="block text-sm font-semibold mb-2"
                        >
                            Username
                        </label>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            required
                            autocomplete="username"
                            placeholder="yourusername"
                            class="input w-full h-12 px-4 rounded-xl border border-gray-200 bg-white text-sm"
                        >

                    </div>


                    <!-- EMAIL -->

                    <div>

                        <label
                            for="email"
                            class="block text-sm font-semibold mb-2"
                        >
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            autocomplete="email"
                            placeholder="you@example.com"
                            class="input w-full h-12 px-4 rounded-xl border border-gray-200 bg-white text-sm"
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div>

                        <label
                            for="password"
                            class="block text-sm font-semibold mb-2"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Minimum 8 characters"
                            class="input w-full h-12 px-4 rounded-xl border border-gray-200 bg-white text-sm"
                        >

                    </div>


                    <!-- ERROR -->

                    <div
                        id="errorMessage"
                        class="hidden rounded-xl bg-red-50 border border-red-100 text-red-600 px-4 py-3 text-sm"
                    ></div>


                    <!-- SUCCESS -->

                    <div
                        id="successMessage"
                        class="hidden rounded-xl bg-green-50 border border-green-100 text-green-600 px-4 py-3 text-sm"
                    ></div>


                    <!-- REGISTER -->

                    <button
                        id="registerButton"
                        type="submit"
                        class="btn-primary w-full py-3 rounded-xl orange-gradient text-white font-semibold"
                    >
                        Create account →
                    </button>

                </form>


                <!-- LOGIN -->

                <p class="text-center text-sm text-gray-500 mt-7">

                    Already registered?

                    <a
                        href="/login/"
                        class="orange-text font-semibold hover:underline"
                    >
                        Sign in
                    </a>

                </p>

            </div>


            <p
                class="text-center text-xs text-gray-400 mt-6"
            >
                By creating an account, you agree to use PulseAPI responsibly.
            </p>

        </div>

    </main>


    <script>

        const form =
            document.getElementById("registerForm");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");

        const registerButton =
            document.getElementById("registerButton");

        const googleRegisterButton =
            document.getElementById("googleRegisterButton");


        /*
         * NORMAL REGISTRATION
         */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                errorMessage.classList.add("hidden");
                successMessage.classList.add("hidden");


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                registerButton.disabled = true;

                registerButton.textContent =
                    "Creating account...";


                try {

                    const response =
                        await fetch(
                            "/api/auth/register/",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username: username,
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        let message =
                            "Unable to create account.";


                        if (data.email) {

                            message =
                                data.email.join(" ");

                        }

                        else if (data.username) {

                            message =
                                data.username.join(" ");

                        }

                        else if (data.password) {

                            message =
                                data.password.join(" ");

                        }

                        else if (data.detail) {

                            message =
                                data.detail;

                        }


                        throw new Error(message);

                    }


                    successMessage.textContent =
                        "Account created successfully. Redirecting to login...";


                    successMessage.classList.remove(
                        "hidden"
                    );


                    form.reset();


                    setTimeout(
                        function() {

                            window.location.href =
                                "/login/";

                        },
                        1200
                    );

                }


                catch (error) {

                    errorMessage.textContent =
                        error.message;

                    errorMessage.classList.remove(
                        "hidden"
                    );

                }


                finally {

                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "Create account →";

                }

            }
        );


        /*
         * GOOGLE OAUTH
         *
         * This route will be implemented
         * when Google OAuth backend is configured.
         */

        googleRegisterButton.addEventListener(
            "click",
            function() {

                window.location.href =
                    "/api/auth/google/";

            }
        );

    </script>

</body>
</html>
